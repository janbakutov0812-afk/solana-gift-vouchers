[package]
name = "solgift_escrow"
version = "0.1.0"
description = "Non-custodial Solgift escrow program for SOL and SPL token vouchers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solgift_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2", features = ["associated_token", "token"] }
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
